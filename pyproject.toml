[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impact-oil-shocks"
version = "0.1.0"
description = "Impact of crude oil price shocks on inflation and economic growth using time-series econometrics and machine learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "statsmodels>=0.14"
]

[project.scripts]
impact-oil-analysis = "impact_oil_project.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
